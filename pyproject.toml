[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "simai-radar"
version = "0.2.0"
description = "Simai event timeline parsing and independent chart analysis"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
mairadar-parse = "mairadar.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100
