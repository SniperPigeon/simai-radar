[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "simai-radar"
version = "0.3.0"
description = "Simai event timeline parsing and independent chart analysis"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
regression = ["numpy>=1.24"]

[project.scripts]
mairadar = "mairadar.cli:main"
mairadar-constants = "mairadar.constants:main"
mairadar-regression = "mairadar.regression.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100
